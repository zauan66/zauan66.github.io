<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>zauan66</title>
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    min-height: 100%;
    touch-action: manipulation;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    color: white;
    background:
        radial-gradient(circle at 50% 20%, #12366b, transparent 35%),
        linear-gradient(135deg, #020617, #071a38, #020617);
}

/* =========================
   DISCO DE MÚSICA
========================= */

.player-musica {
    position: fixed;
    top: 15px;
    right: 15px;
    width: 68px;
    height: 68px;
    z-index: 9999;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
}

.disco {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    position: relative;
    background: repeating-radial-gradient(
        circle at center,
        #050505 0px,
        #111 2px,
        #030303 4px,
        #151515 6px
    );
    box-shadow: 0 0 8px rgba(255,255,255,0.18), 0 0 20px rgba(0,0,0,0.8);
    overflow: hidden;
    pointer-events: none;
}

.disco::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(
        135deg,
        transparent 0%,
        transparent 42%,
        rgba(255,255,255,0.18) 48%,
        transparent 53%,
        transparent 100%
    );
    pointer-events: none;
}

.disco::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(
        circle,
        #d4af37 0%,
        #d4af37 35%,
        #171717 38%,
        #050505 100%
    );
    box-shadow: 0 0 4px rgba(0,0,0,0.9);
    pointer-events: none;
}

.disco.tocando {
    animation: girarDisco 2.5s linear infinite;
}

@keyframes girarDisco {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* =========================
   MENU DE MÚSICA
========================= */

.menu-musica {
    display: none;
    position: fixed;
    top: 90px;
    right: 15px;
    left: 15px;
    max-width: 340px;
    margin: 0 auto;
    padding: 20px;
    z-index: 10000;
    background: rgba(5, 15, 32, 0.98);
    border: 1px solid #2563eb;
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(0,217,255,0.25), 0 10px 40px rgba(0,0,0,0.8);
}

.menu-musica.aberto {
    display: block;
}

.menu-musica h3 {
    color: #60a5fa;
    font-size: 20px;
    margin-bottom: 15px;
    text-align: center;
}

.lista-musicas {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 15px;
}

.item-musica {
    width: 100%;
    padding: 14px;
    border: 1px solid rgba(37, 99, 235, 0.5);
    border-radius: 12px;
    background: #061225;
    color: #d5deea;
    font-family: Arial, sans-serif;
    font-size: 16px;
    text-align: left;
    cursor: pointer;
    touch-action: manipulation;
}

.item-musica.ativa {
    border-color: #00d9ff;
    color: white;
    background: rgba(0, 217, 255, 0.15);
    box-shadow: 0 0 12px rgba(0,217,255,0.35);
}

.item-musica.secreta {
    border-color: #f59e0b;
    color: #fef08a;
    background: rgba(245, 158, 11, 0.2);
    box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
}

.controles-musica {
    display: flex;
    gap: 8px;
}

.botao-musica {
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
}

.botao-fechar {
    margin-top: 10px;
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    background: #1f2937;
    color: #d1d5db;
    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
}

/* =========================
   POPUP SECRETO (MEME)
========================= */

.dialogo-secreto {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 88%;
    max-width: 320px;
    background: #f0f0f0;
    color: #111;
    border: 1px solid #999;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    border-radius: 6px;
    z-index: 15000;
    font-family: Arial, sans-serif;
}

.dialogo-secreto.visivel {
    display: block;
}

.dialogo-topo {
    background: #e3e3e3;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: bold;
    color: #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ccc;
}

.dialogo-fechar-x {
    cursor: pointer;
    font-size: 16px;
    color: #666;
    background: none;
    border: none;
    padding: 4px 8px;
    touch-action: manipulation;
}

.dialogo-corpo {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px 16px;
}

.dialogo-icone {
    font-size: 38px;
    line-height: 1;
    animation: pulsarEmoji 0.5s infinite alternate ease-in-out;
}

@keyframes pulsarEmoji {
    0% { transform: scale(1) rotate(-8deg); }
    100% { transform: scale(1.15) rotate(8deg); }
}

.dialogo-texto {
    font-size: 16px;
    color: #111;
    font-weight: bold;
    line-height: 1.4;
    word-break: break-word;
}

.dialogo-rodape {
    display: flex;
    justify-content: center;
    padding: 0 16px 16px;
}

.dialogo-ok {
    min-width: 85px;
    padding: 8px 18px;
    background: #e1e1e1;
    border: 1px solid #adadad;
    border-radius: 4px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
}

/* =========================
   TELA INICIAL
========================= */

.inicio {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
}

.nome {
    font-size: clamp(55px, 14vw, 95px);
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 40px;
    text-shadow: 0 0 30px rgba(70,160,255,0.35);
    user-select: none;
    cursor: pointer;
    touch-action: manipulation;
    padding: 10px;
}

.nome.desbloqueado {
    text-shadow: 0 0 35px rgba(245, 158, 11, 0.9), 0 0 60px rgba(245, 158, 11, 0.5);
}

/* =========================
   BOTÕES NEON
========================= */

.botao {
    position: relative;
    width: 200px;
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 18px;
    color: white;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 17px;
    font-weight: bold;
    background: #061225;
    margin: 10px;
    overflow: hidden;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 0 10px rgba(0,217,255,0.25), inset 0 0 20px rgba(0,217,255,0.05);
}

.botao::before {
    content: "";
    position: absolute;
    width: 180%;
    height: 180%;
    background: conic-gradient(
        transparent 0deg,
        transparent 250deg,
        #00eaff 280deg,
        #ffffff 300deg,
        #00eaff 320deg,
        transparent 350deg
    );
    animation: luzNeon 2.2s linear infinite;
    pointer-events: none;
}

.botao::after {
    content: "";
    position: absolute;
    inset: 2px;
    border-radius: 16px;
    background: #061225;
    pointer-events: none;
}

.botao span {
    position: relative;
    z-index: 10;
    pointer-events: none;
}

@keyframes luzNeon {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* =========================
   HISTÓRIA
========================= */

#historia {
    display: none;
    min-height: 100vh;
    padding: 30px 20px;
}

.caixa {
    max-width: 850px;
    margin: 40px auto;
    padding: 25px;
    background: rgba(5,15,32,0.95);
    border: 1px solid #2563eb;
    border-radius: 20px;
}

.caixa h2 {
    color: #60a5fa;
    font-size: 28px;
    margin-bottom: 20px;
}

.texto {
    color: #d5deea;
    font-size: 16px;
    line-height: 1.8;
}

/* =========================
   MENÇÕES HONROSAS
========================= */

#mencoes {
    display: none;
    position: relative;
    width: 100%;
    min-height: 100vh;
    padding: 50px 20px;
    text-align: center;
    overflow: hidden;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: #000;
}

#mencoes video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
}

#mencoes::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.40);
    z-index: 1;
    pointer-events: none;
}

.conteudo-mencoes {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
}

#mencoes h1 {
    color: #60a5fa;
    font-size: 28px;
    margin-bottom: 25px;
    text-shadow: 0 0 10px rgba(96,165,250,0.8), 0 0 25px rgba(96,165,250,0.5);
}
